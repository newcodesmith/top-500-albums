<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="assets/css/nme_styles.css">
    <link rel="stylesheet" href="assets/css/albumsPage.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
    <title>Top 500 Albums</title>

    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>

    <script type="module" src="assets/js/nme_script.js"></script>
</head>

<body id='main'>
    <header>
        <nav id='numberNav'>
            <ul id='numberNavBar'>
                <li>
                    <a href="index.html" class="landingPageLink">LANDING PAGE</a>
                </li>
                <li>
                    <img src="assets/images/nme_logo.png" alt="NME Logo" class="navLogo" style="height: 45px">
                </li>
                <li>
                    <a href="#main" class='active'>1-50</a>
                </li>
                <li>
                    <a href="#50">51-100</a>
                </li>
                <li>
                    <a href="#100">101-150</a>
                </li>
                <li>
                    <a href="#150">151-200</a>
                </li>
                <li>
                    <a href="#200">201-250</a>
                </li>
                <li>
                    <a href="#250">251-300</a>
                </li>
                <li>
                    <a href="#300">301-350</a>
                </li>
                <li>
                    <a href="#350">351-400</a>
                </li>
                <li>
                    <a href="#400">401-450</a>
                </li>
                <li>
                    <a href="#450">451-500</a>
                </li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div id="logoContainer">
            <div id="header_logo">
                <a href="http://www.nme.com/photos/the-500-greatest-albums-of-all-time-100-1-1426116" target="_blank">
                    <img src="assets/images/nme_logo.png" alt="RollingStone Logo" class="main_logo" style="height: 90px">
                </a>
            </div>
            <h1>500 GREATEST ALBUMS OF ALL TIME</h1>
        </div>
        <!-- The Modal -->
        <div id="myModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="artistTitle">
            <!-- Modal content -->
            <div class="modal-content">
                <button class="close" aria-label="Close album details" type="button">
                    <span aria-hidden="true">&times;</span>
                </button>
                <div class="modal_content_cover">
                    <div class="infoContainer">
                        <img class="modalAlbumCover" src="" alt="Album Cover" role="img">
                        <h4 id="artistTitle">Artist and Album Name</h4>
                        <h5 id="albumYear">Album Year:</h5>
                        <h5 id="rankNo">Rank No.</h5>
                    </div>
                    <div class="infoContainer">
                        <h5>Album Tracks</h5>
                        <ul id="trackListing" role="list" aria-label="Track listing">
                        </ul>
                        <p>
                            <small>*For more info about this album click below</small>
                        </p>
                        <div>
                            <a id='releaseUrl' href="" target="_blank" rel="noopener noreferrer" aria-label="View album on Discogs">
                                <img src="/assets/images/discogs_logo_white.png" alt="Discogs Logo" id="discogsLogo">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- The Modal -->

        <div class="albumCoverBackground">
            <ol class="albumCoverList">
                <div class="loading-container">
                    <h2 class="loading-text">LOADING</h2>
                    <div class="loading-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            </ol>
        </div>

    </div>
</body>

</html>
